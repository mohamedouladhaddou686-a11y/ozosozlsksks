name: SSH via Bore (Stable)

on:
  workflow_dispatch:

jobs:
  ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Setup SSH & Bore
        run: |
          sudo apt update -y
          sudo apt install -y openssh-server curl
          sudo service ssh start
          echo "runner:root123" | sudo chpasswd

          # تحميل Bore
          curl -L https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz | tar -xz
          chmod +x bore

          # تشغيل النفق
          echo "🚀 جاري فتح النفق..."
          ./bore local 22 --to bore.pub 2>&1 | tee bore.log &

          # استنى 5 ثواني باش يتهيأ
          sleep 5

          # استخرج المنفذ
          PORT=$(grep -oP 'listening at bore\.pub:\K\d+' bore.log | head -1)

          echo ""
          echo "======================================"
          echo "🔐 SSH Connection String:"
          if [[ -n "$PORT" ]]; then
            # باش يخرج الرابط بنفس صيغة tmate (بدون runner@)
            # ولكن خاصك تحط runner@ فـ الأمر دياك
            echo "ssh runner@bore.pub -p $PORT"
            echo "🔑 Password: root123"
          else
            echo "⚠️ لم نتمكن من استخراج المنفذ. حاول تشغيل الأمر يدوياً:"
            echo "   grep 'listening at' bore.log"
          fi
          echo "======================================"
          echo "⏳ الجلسة مستمرة لمدة 6 ساعات... اضغط Ctrl+C للإيقاف"

          # خلي الجلسة شغالة
          sleep infinity
